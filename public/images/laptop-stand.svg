<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#f8fafc"/>
  <rect x="50" y="50" width="300" height="300" rx="20" fill="#e2e8f0"/>
  
  <!-- Laptop Stand illustration -->
  <rect x="100" y="120" width="200" height="120" rx="8" fill="#1e293b"/>
  <rect x="110" y="130" width="180" height="100" rx="4" fill="#374151"/>
  
  <!-- Stand legs -->
  <polygon points="120,240 140,280 160,240" fill="#64748b"/>
  <polygon points="240,240 260,280 280,240" fill="#64748b"/>
  
  <!-- Base -->
  <rect x="130" y="275" width="140" height="10" rx="5" fill="#64748b"/>
  
  <!-- Product label -->
  <rect x="80" y="320" width="240" height="40" rx="8" fill="#8b5cf6"/>
  <text x="200" y="345" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Laptop Stand</text>
</svg>




